# Office machine (runs 24/7). The app is published at https://auto-fill.tdatnguyen.id.vn/ (BASE_PATH empty).
#
# Cloudflare Tunnel, two ways (use ONE, never both: Cloudflare would split requests between them):
# - Windows service (cloudflared installed with the command shown in the Cloudflare dashboard):
#     route auto-fill.tdatnguyen.id.vn  →  http://localhost:8080
#     start with: docker compose up -d --build
# - Container below (no install on the machine; CLOUDFLARE_TUNNEL_TOKEN in .env):
#     route auto-fill.tdatnguyen.id.vn  →  http://app:8080
#     start with: docker compose --profile tunnel up -d --build
#
# App image: built here by default; or set AUTOFILL_IMAGE=ghcr.io/<owner>/<repo>:latest in .env and
# update with: docker compose pull && docker compose up -d
services:
  app:
    image: ${AUTOFILL_IMAGE:-autofill-studio:local}
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - app
