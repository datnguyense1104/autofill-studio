<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kết quả · AutoFill Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div>
        <h1>Kết quả điền mẫu</h1>
        <p id="run-sub" class="muted"></p>
      </div>
      <div class="user-bar">
        <a class="btn btn-ghost" href="./">Về trang chính</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="progress" class="panel" hidden aria-live="polite">
      <h2 class="panel-title">Đang điền mẫu</h2>
      <p id="progress-text" class="muted"></p>
      <p class="muted small">Có thể đóng trang này; việc điền vẫn tiếp tục và có trong Lịch sử ở trang chính.</p>
    </section>
    <article id="card" class="card loading"></article>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="review-view.js"></script>
</body>
</html>
